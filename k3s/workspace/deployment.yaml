apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-service
  labels: {app: workspace-service}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app: workspace-service}
  template:
    metadata:
      labels: {app: workspace-service}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: workspace-service
          image: bdc/bdc-workspace:replace-with-immutable-tag
          ports: [{containerPort: 8088, name: http}]
          env:
            - name: PORT
              value: '8088'
            - name: WORKSPACE_DB_POOL_MAX
              value: '6'
            - name: WORKSPACE_DATABASE_NAME
              value: bdc_workspace
            - name: WORKSPACE_MIGRATE_ON_START
              valueFrom:
                configMapKeyRef:
                  name: bdc-workspace-config
                  key: WORKSPACE_MIGRATE_ON_START
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: bdc-workspace-secrets, key: DATABASE_URL}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: bdc-secrets, key: JWT_SECRET}
            - name: WORKSPACE_MCP_SECRET
              valueFrom:
                secretKeyRef: {name: bdc-secrets, key: WORKSPACE_MCP_SECRET, optional: true}
            - name: WORKSPACE_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef: {name: bdc-workspace-config, key: WORKSPACE_ALLOWED_ORIGINS}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 32Mi}
            limits: {cpu: '1', memory: 512Mi, ephemeral-storage: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-service
spec:
  selector: {app: workspace-service}
  ports: [{name: http, port: 8088, targetPort: http}]
