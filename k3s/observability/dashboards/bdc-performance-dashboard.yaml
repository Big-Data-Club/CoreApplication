apiVersion: v1
kind: ConfigMap
metadata:
  name: bdc-performance-dashboard
  labels:
    grafana_dashboard: "1"
data:
  bdc-performance.json: |
    {
      "annotations":{"list":[]},
      "editable":true,
      "panels":[
        {"type":"stat","title":"Active VUs","gridPos":{"h":6,"w":6,"x":0,"y":0},"targets":[{"expr":"sum(k6_vus{testid=~\"$testid\"})","refId":"A"}]},
        {"type":"stat","title":"Request rate","gridPos":{"h":6,"w":6,"x":6,"y":0},"targets":[{"expr":"sum(rate(k6_http_reqs_total{testid=~\"$testid\"}[$__rate_interval]))","refId":"A"}]},
        {"type":"stat","title":"HTTP error rate","fieldConfig":{"defaults":{"unit":"percentunit"}},"gridPos":{"h":6,"w":6,"x":12,"y":0},"targets":[{"expr":"sum(k6_http_req_failed{testid=~\"$testid\"})","refId":"A"}]},
        {"type":"stat","title":"Journey error rate","fieldConfig":{"defaults":{"unit":"percentunit"}},"gridPos":{"h":6,"w":6,"x":18,"y":0},"targets":[{"expr":"sum(k6_journey_failed{testid=~\"$testid\"})","refId":"A"}]},
        {"type":"timeseries","title":"Latency p50 / p95 / p99","gridPos":{"h":8,"w":12,"x":0,"y":6},"fieldConfig":{"defaults":{"unit":"s"}},"targets":[{"expr":"histogram_quantile(0.50, sum by (le) (rate(k6_http_req_duration_seconds_bucket{testid=~\"$testid\"}[$__rate_interval])))","legendFormat":"p50","refId":"A"},{"expr":"histogram_quantile(0.95, sum by (le) (rate(k6_http_req_duration_seconds_bucket{testid=~\"$testid\"}[$__rate_interval])))","legendFormat":"p95","refId":"B"},{"expr":"histogram_quantile(0.99, sum by (le) (rate(k6_http_req_duration_seconds_bucket{testid=~\"$testid\"}[$__rate_interval])))","legendFormat":"p99","refId":"C"}]},
        {"type":"timeseries","title":"Requests and errors by route","gridPos":{"h":8,"w":12,"x":12,"y":6},"targets":[{"expr":"sum by (name) (rate(k6_http_reqs_total{testid=~\"$testid\"}[$__rate_interval]))","legendFormat":"{{name}} rps","refId":"A"},{"expr":"sum by (name) (k6_http_req_failed{testid=~\"$testid\"})","legendFormat":"{{name}} error rate","refId":"B"}]},
        {"type":"timeseries","title":"Pod CPU","gridPos":{"h":8,"w":8,"x":0,"y":14},"fieldConfig":{"defaults":{"unit":"cores"}},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\",container!=\"\",pod=~\"(auth|lms|lab|chat|ai|personalize|recommender)-.*\"}[$__rate_interval]))","legendFormat":"{{pod}}","refId":"A"}]},
        {"type":"timeseries","title":"Pod memory","gridPos":{"h":8,"w":8,"x":8,"y":14},"fieldConfig":{"defaults":{"unit":"bytes"}},"targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"default\",container!=\"\",pod=~\"(auth|lms|lab|chat|ai|personalize|recommender)-.*\"})","legendFormat":"{{pod}}","refId":"A"}]},
        {"type":"timeseries","title":"CPU throttling ratio","gridPos":{"h":8,"w":8,"x":16,"y":14},"fieldConfig":{"defaults":{"unit":"percentunit"}},"targets":[{"expr":"sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"default\",container!=\"\",pod=~\"(auth|lms|lab|chat|ai|personalize|recommender)-.*\"}[$__rate_interval])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"default\",container!=\"\",pod=~\"(auth|lms|lab|chat|ai|personalize|recommender)-.*\"}[$__rate_interval])), 1)","legendFormat":"{{pod}}","refId":"A"}]},
        {"type":"timeseries","title":"Node saturation","gridPos":{"h":8,"w":12,"x":0,"y":22},"fieldConfig":{"defaults":{"unit":"percent"}},"targets":[{"expr":"100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])))","legendFormat":"CPU","refId":"A"},{"expr":"100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))","legendFormat":"memory","refId":"B"}]},
        {"type":"table","title":"Pod restarts during test","gridPos":{"h":8,"w":12,"x":12,"y":22},"targets":[{"expr":"sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"default\",pod=~\"(auth|lms|lab|chat|ai|personalize|recommender)-.*\"})","format":"table","instant":true,"refId":"A"}]}
      ],
      "refresh":"10s",
      "schemaVersion":41,
      "tags":["bdc","performance","k6"],
      "templating":{"list":[{"name":"testid","label":"Test ID","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(k6_vus, testid)","includeAll":true,"allValue":".*","current":{"text":"All","value":"$__all"}}]},
      "time":{"from":"now-15m","to":"now"},
      "title":"BDC Performance",
      "uid":"bdc-performance",
      "version":1
    }
