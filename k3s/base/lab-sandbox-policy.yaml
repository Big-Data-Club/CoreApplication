# This namespace is intentionally empty until the isolated executor worker is
# deployed.  It establishes the security envelope first, so a future coding,
# terminal, or HPC job cannot accidentally start with cluster-default access.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: learner-workload-quota
  namespace: lab-sandbox
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    limits.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 16Gi
    count/jobs.batch: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: learner-workload-limits
  namespace: lab-sandbox
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lab-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-sandbox-runner
  namespace: lab-sandbox
automountServiceAccountToken: false
---
# The control plane will use this service account only after the executor
# controller is deployed.  Its permissions are narrowly scoped to jobs in the
# sandbox namespace and cannot read secrets, exec into pods, or modify services.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-execution-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-execution-controller
  namespace: lab-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-execution-controller
  namespace: lab-sandbox
subjects:
  - kind: ServiceAccount
    name: lab-execution-controller
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-execution-controller
