apiVersion: apps/v1
kind: Deployment
metadata:
  name: personalize-service
  labels:
    app: personalize-service
spec:
  replicas: 1
  # DuckDB is an embedded, single-writer database stored on the PVC below.
  # A default RollingUpdate briefly starts a new pod while the old pod still
  # owns the file lock, causing the new pod to CrashLoop.  Recreate preserves
  # the one-writer invariant: stop the old pod, then start its replacement.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: personalize-service
  template:
    metadata:
      labels:
        app: personalize-service
    spec:
      containers:
      - name: personalize-service
        image: phucnhan2809/bdc-personalize:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: bdc-config
        env:
        - name: DATA_DIR
          value: "/app/data"
        - name: AI_SERVICE_SECRET
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: AI_SERVICE_SECRET
        resources:
          limits:
            cpu: "1.0"
            memory: 1Gi
          requests:
            cpu: "0.25"
            memory: 256Mi
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: personalize-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: personalize-service
  labels:
    app: personalize-service
spec:
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
  selector:
    app: personalize-service
