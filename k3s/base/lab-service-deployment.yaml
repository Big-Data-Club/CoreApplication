apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-service
  labels:
    app: lab-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-service
  template:
    metadata:
      labels:
        app: lab-service
    spec:
      serviceAccountName: lab-execution-controller
      # The controller needs only its projected Kubernetes API token to create
      # short-lived Jobs in lab-sandbox; its RBAC cannot access secrets or exec.
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: prepare-hpc-credentials
        image: alpine:3.20
        command: ["/bin/sh", "-ec"]
        args:
        - |
          if [ -f /hpc-source/id_ed25519 ] && [ -f /hpc-source/known_hosts ]; then
            install -o 1000 -g 1000 -m 0400 /hpc-source/id_ed25519 /hpc-runtime/id_ed25519
            install -o 1000 -g 1000 -m 0444 /hpc-source/known_hosts /hpc-runtime/known_hosts
          fi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: hpc-slurm-credentials-source
          mountPath: /hpc-source
          readOnly: true
        - name: hpc-slurm-credentials
          mountPath: /hpc-runtime
      containers:
      - name: lab-service
        image: phucnhan2809/bdc-lab:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: bdc-config
        env:
        # DB connection variables
        - name: DB_HOST
          value: "$(LAB_POSTGRES_HOST)"
        - name: DB_PORT
          value: "5432"
        - name: DB_SSL_MODE
          value: "$(AI_DB_SSL)"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: LAB_POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: LAB_POSTGRES_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: LAB_POSTGRES_DB
        # Redis connection variables
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: REDIS_PASSWORD
        - name: REDIS_DB
          value: "2"
        # MinIO/R2 Storage setup
        - name: LAB_MINIO_ENDPOINT
          value: "$(LAB_R2_ENDPOINT)"
        - name: LAB_MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: MINIO_ROOT_USER
        - name: LAB_MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: MINIO_ROOT_PASSWORD
        - name: LAB_MINIO_USE_SSL
          value: "$(LAB_MINIO_USE_SSL)"
        # Secret sync keys
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: JWT_SECRET
        - name: LMS_SYNC_SECRET
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: LMS_SYNC_SECRET
        - name: GOMAXPROCS
          value: "2"
        # Database lab sandbox connection URL (Neon)
        - name: DB_LAB_POSTGRES_URL
          value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(LAB_POSTGRES_HOST)/$(DB_NAME)?sslmode=require"
        # LeetCode-style executor. Jobs run only in lab-sandbox, never in this
        # API pod. Keep this local to lab-service so changing it cannot restart
        # unrelated workers such as document indexing.
        - name: LAB_CODING_SANDBOX_ENABLED
          value: "true"
        - name: LAB_CODING_SANDBOX_NAMESPACE
          value: "lab-sandbox"
        - name: LAB_CODING_SANDBOX_PYTHON_IMAGE
          value: "python:3.12-alpine"
        - name: LAB_CODING_SANDBOX_C_IMAGE
          value: "gcc:14"
        - name: LAB_CODING_SANDBOX_CPP_IMAGE
          value: "gcc:14"
        - name: LAB_CODING_SANDBOX_JAVA_IMAGE
          value: "eclipse-temurin:21-jdk-alpine"
        - name: LAB_CODING_SANDBOX_GO_IMAGE
          value: "golang:1.25-alpine"
        - name: LAB_CODING_SANDBOX_RUST_IMAGE
          value: "rust:1.88-alpine"
        - name: LAB_CODING_SANDBOX_SCALA_IMAGE
          value: "phucnhan2809/bdc-lab-scala-sandbox:latest"
        - name: LAB_CODING_SANDBOX_MAX_TIME
          value: "10s"
        - name: LAB_CODING_SANDBOX_MAX_COMPILE_TIME
          value: "30s"
        - name: LAB_CODING_SANDBOX_PROVISION_TIMEOUT
          value: "90s"
        - name: LAB_CODING_SANDBOX_MAX_MEMORY_MB
          value: "512"
        - name: LAB_CODING_SANDBOX_MAX_CPU
          value: "1"
        - name: LAB_CODING_SANDBOX_POLL_INTERVAL
          value: "250ms"
        - name: LAB_CODING_SANDBOX_JOB_TTL_SECONDS
          value: "60"
        volumeMounts:
        - name: hpc-slurm-credentials
          mountPath: /etc/lab-hpc
          readOnly: true
        resources:
          limits:
            cpu: "2.0"
            memory: 1Gi
          requests:
            cpu: "0.5"
            memory: 256Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      # This optional Secret is created out-of-band by the HPC operator. It
      # contains only an unencrypted submit-only SSH key and pinned host keys;
      # it must never be uploaded through the lab authoring UI.
      - name: hpc-slurm-credentials
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: hpc-slurm-credentials-source
        secret:
          secretName: hpc-slurm-credentials
          optional: true
          defaultMode: 0444

---
apiVersion: v1
kind: Service
metadata:
  name: lab-service
  labels:
    app: lab-service
spec:
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
  selector:
    app: lab-service
