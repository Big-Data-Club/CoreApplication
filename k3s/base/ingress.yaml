apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bdc-ingress-auth
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      default-compress@kubernetescrd,
      default-strip-apiv1@kubernetescrd
spec:
  rules:
  - host: bdc.hpcc.vn
    http:
      paths:
      - path: /apiv1
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8080

---
