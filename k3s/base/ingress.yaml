  name: bdc-ingress-mcp
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      default-compress@kubernetescrd,
      default-mcp-ratelimit@kubernetescrd
spec:
  rules:
  - host: bdc.hpcc.vn
    http:
      paths:
      - path: /mcp
        pathType: Prefix
        backend:
          service:
