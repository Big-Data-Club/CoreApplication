            port:
              number: 8000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bdc-ingress-ai-gateway
  namespace: default
  annotations:
    # No compress middleware here: gzip can buffer SSE and break LLM streams.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      default-aimodels-strip@kubernetescrd,
      default-aimodels-ratelimit@kubernetescrd
spec:
  rules:
  - host: bdc.hpcc.vn
    http:
      paths:
      - path: /aimodels
        pathType: Prefix
        backend:
          service:
            name: ai-gateway
            port:
              number: 8090

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bdc-ingress-ai-gateway-info
  namespace: default
  annotations:
    # Marketing site; longer path wins via Traefik auto-priority over /aimodels.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      default-aimodels-info-rewrite@kubernetescrd,
      default-compress@kubernetescrd,
      default-aimodels-info-cache@kubernetescrd
spec:
  rules:
  - host: bdc.hpcc.vn
    http:
      paths:
      - path: /aimodels/info
        pathType: Prefix
        backend:
          service:
            name: ai-gateway-info
            port:
              number: 8091

---
# ── Traefik Middleware: Coarse edge protection for public MCP ────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-ratelimit
  namespace: default
spec:
  rateLimit:
    average: 30
    burst: 60
    period: 1m

---
# ── Traefik Middleware: Global Compression ────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: default
spec:
  compress: {}

---
# ── Traefik Middleware: Strip /apiv1 prefix for Auth Service ─────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-apiv1
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /apiv1

---
# ── Traefik Middleware: Rewrite /lmsapiv1 → /api/v1 ─────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-lms
  namespace: default
spec:
  replacePathRegex:
    regex: "^/lmsapiv1/(.*)"
    replacement: "/api/v1/$1"

---
# ── Traefik Middleware: Rewrite /files → /api/v1/files/serve ─────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-files
  namespace: default
spec:
  replacePathRegex:
    regex: "^/files/(.*)"
    replacement: "/api/v1/files/serve/$1"

---
# ── Traefik Middleware: Rewrite /labapiv1 → /api/v1 ─────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-lab
  namespace: default
spec:
  replacePathRegex:
    regex: "^/labapiv1/(.*)"
    replacement: "/api/v1/$1"

---
# ── Traefik Middleware: Rewrite /chatapiv1 → /api/v1 ────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-chat
  namespace: default
spec:
  replacePathRegex:
    regex: "^/chatapiv1/(.*)"
    replacement: "/api/v1/$1"

---
# ── Traefik Middleware: Rewrite /dutylogapiv1 → /api/v1 ─────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-dutylog
  namespace: default
spec:
  replacePathRegex:
    regex: "^/dutylogapiv1/(.*)"
    replacement: "/api/v1/$1"

---
# ── Traefik Middleware: Cache headers for /uploads (auth service files) ───────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uploads-cache
  namespace: default
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=31536000, immutable"

---
# ── Traefik Middleware: Cache headers for /files (LMS served files) ───────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: files-cache
  namespace: default
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=31536000, immutable"
---
# ── Traefik Middleware: Strip /aimodels prefix for the AI Gateway ────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aimodels-strip
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /aimodels
---
# ── Traefik Middleware: Rate limit /aimodels (gateway already needs a bearer) ─
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aimodels-ratelimit
  namespace: default
spec:
  rateLimit:
    average: 120
    burst: 240
    period: 1m
---
# ── Traefik Middleware: /aimodels/info → static marketing site root ──────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aimodels-info-rewrite
  namespace: default
spec:
  replacePathRegex:
    regex: "^/aimodels/info"
    replacement: "/"
---
# ── Traefik Middleware: Cache headers for the static /aimodels/info page ─────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aimodels-info-cache
  namespace: default
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=600, must-revalidate"
