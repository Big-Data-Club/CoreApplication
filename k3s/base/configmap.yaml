apiVersion: v1
kind: ConfigMap
metadata:
  name: bdc-config
data:
  # General Application Configuration
  SPRING_PROFILES_ACTIVE: "docker"
  VERSION: "1.0.0"
  APP_ENV: "production"
  GIN_MODE: "release"
  LOG_LEVEL: "INFO"

  # Internal Service Endpoints (Kubernetes DNS Names)
  BACKEND_URL: "http://auth-service:8080"
  LMS_API_URL: "http://lms-service:8081"
  AI_SERVICE_URL: "http://ai-service:8000"
  PERSONALIZE_SERVICE_URL: "http://personalize-service:8082"
  RECOMMENDER_SERVICE_URL: "http://recommender-service:8086"
  LMS_SERVICE_URL: "http://lms-service:8081"
  CHAT_API_URL: "http://chat-service:8083"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  
  # Message Broker & Cache endpoints
  KAFKA_BROKERS: "kafka-service:9092"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  POSTGRES_HOST: "ep-red-dawn-aoisjsb3-pooler.c-2.ap-southeast-1.aws.neon.tech"
  LMS_POSTGRES_HOST: "ep-red-dawn-aoisjsb3-pooler.c-2.ap-southeast-1.aws.neon.tech"
  LAB_POSTGRES_HOST: "ep-red-dawn-aoisjsb3-pooler.c-2.ap-southeast-1.aws.neon.tech"
  CHAT_POSTGRES_HOST: "ep-red-dawn-aoisjsb3-pooler.c-2.ap-southeast-1.aws.neon.tech"
  AI_POSTGRES_HOST: "ep-red-dawn-aoisjsb3-pooler.c-2.ap-southeast-1.aws.neon.tech"
  QDRANT_URL: "https://9676b48e-2801-42d5-9005-cc7dd0a2c775.eu-central-1-0.aws.cloud.qdrant.io:6333"
  NEO4J_URI: "neo4j+s://ac1a6436.databases.neo4j.io"
  NEO4J_USERNAME: "ac1a6436"
  R2_ENDPOINT: "de042190b722983f81c12477f844e9a0.r2.cloudflarestorage.com"
  LAB_R2_ENDPOINT: "de042190b722983f81c12477f844e9a0.r2.cloudflarestorage.com"

  # DB SSL Configurations
  AI_DB_SSL: "require"
  CHAT_DB_SSL_MODE: "require"
  MINIO_USE_SSL: "true"
  LAB_MINIO_USE_SSL: "true"

  # Ports
  BACKEND_PORT: "8080"
  LMS_PORT: "8081"
  LAB_PORT: "8082"
  CHAT_PORT: "8083"

  # HikariCP Connection Pool (Java)
  HIKARI_MAX_POOL_SIZE: "10"
  HIKARI_MIN_IDLE: "5"
  HIKARI_CONNECTION_TIMEOUT: "30000"
  HIKARI_IDLE_TIMEOUT: "600000"
  HIKARI_MAX_LIFETIME: "1800000"

  # JPA / Hibernate Settings
  JPA_DDL_AUTO: "update"
  JPA_SHOW_SQL: "false"

  # Redis Pool Settings (Go)
  REDIS_POOL_SIZE: "50"
  REDIS_MIN_IDLE_CONNS: "10"
  REDIS_DIAL_TIMEOUT: "3s"
  REDIS_READ_TIMEOUT: "500ms"
  REDIS_WRITE_TIMEOUT: "500ms"
  REDIS_POOL_TIMEOUT: "1s"

  # Go DB Pool Settings
  DB_MAX_OPEN_CONNS: "50"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME: "30m"
  DB_CONN_MAX_IDLE_TIME: "5m"

  # AI Settings
  # These names are consumed directly by Pydantic Settings in ai-service.
  CHAT_MODEL: "openai/gpt-oss-120b"
  QUIZ_MODEL: "openai/gpt-oss-120b"
  LLM_REQUEST_TOKEN_BUDGET: "10000"
  EMBEDDING_MODEL: "BAAI/bge-m3"
  EMBEDDING_DIMENSIONS: "1024"
  EMBEDDING_PREFIX_MODE: "bge"
  RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  REINDEX_BATCH_SIZE: "5"
  DOCUMENT_INDEX_TIMEOUT_MINUTES: "90"
  DOCUMENT_INDEX_STALE_AFTER_MINUTES: "45"
  DOCUMENT_INDEX_MAX_POLL_INTERVAL_MS: "10800000"
  RERANK_FETCH_K: "15"
  STORAGE_TYPE: "minio"
  UPLOAD_MAX_SIZE: "104857600"
  USE_QDRANT: "true"
  USE_RERANKER: "true"
  # No vision model is currently available for the configured provider.
  # Skip image downloads/VLM retries until a valid vision binding is added.
  VLM_ENABLED: "false"
  # Neo4j is currently unreachable from the cluster. It is a derived graph,
  # not the source of truth for document indexing, so keep it disabled until
  # connectivity is restored.
  NEO4J_ENABLED: "false"
  YOUTUBE_WHISPER_FALLBACK: "true"
  LLM_PROVIDER: "groq"
  APP_PUBLIC_URL: "https://bdc.hpcc.vn"
  CORS_ALLOWED_ORIGINS: "https://bdc.hpcc.vn,http://localhost:3000"

  # NextJS Options
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_YOUTUBE_UPLOAD_ENABLED: "true"

  # Thread optimizations for ML libraries in AI Service
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"
