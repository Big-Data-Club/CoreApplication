# ── AI Gateway marketing site (bdc.hpcc.vn/aimodels/info) ────────────────────
# Fully static, zero-framework page served by a minimal nginx pod, separate from
# the tunnel/gateway pods so public traffic never touches model infrastructure.
# Content is marketing-safe: model names and capabilities only, never hosts,
# ports, model IDs from internal config, credentials or cluster topology.
# The live model list is fetched from the gateway's public catalog endpoint
# (/aimodels/public/models) which exposes no backend details.
# Logo and favicon are the BDC brand assets from frontend/src/assets/bdclogo.png
# (resized, embedded as binaryData so the page needs no external asset host).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-info-nginx
  labels:
    app: ai-gateway-info
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      server_tokens off;
      root /usr/share/nginx/html;
      index index.html;
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-info-content
  labels:
    app: ai-gateway-info
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>BDC Hub | Campus AI Models</title>
    <meta name="description" content="Chat, vision, semantic search and speech models running on Big Data Club's own GPU cluster. OpenAI compatible and built into the BDC Hub learning platform.">
    <meta property="og:title" content="BDC Hub | Campus AI Models">
    <meta property="og:description" content="Chat, vision, search and speech models running on a dedicated campus GPU cluster.">
    <meta property="og:type" content="website">
    <link rel="icon" href="/aimodels/info/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
    <script>
    (function () {
      try {
        var saved = localStorage.getItem('bdc-aimodels-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    </script>
    <style>
    :root {
      --bg: #050B18;
      --bg-soft: #070E1C;
      --surface: #0F1E35;
      --surface-2: #132240;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(59, 130, 246, 0.14);
      --border-strong: rgba(59, 130, 246, 0.3);
      --accent: #3B82F6;
      --accent-2: #22D3EE;
      --chip: #16233c;
      --chip-text: #cbd7e8;
      --shadow: 0 24px 60px -30px rgba(2, 8, 23, 0.9);
      --glow: rgba(34, 211, 238, 0.16);
      --nav: rgba(5, 11, 24, 0.78);
      --display: 'Comfortaa', ui-rounded, system-ui, sans-serif;
      --body: 'Nunito Sans', system-ui, -apple-system, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f5f8ff;
      --bg-soft: #eef3fc;
      --surface: #ffffff;
      --surface-2: #eef3ff;
      --text: #0b1729;
      --muted: #5b6b82;
      --border: rgba(15, 52, 110, 0.10);
      --border-strong: rgba(37, 99, 235, 0.28);
      --accent: #2563eb;
      --accent-2: #0891b2;
      --chip: #eaf1ff;
      --chip-text: #1e3a68;
      --shadow: 0 24px 50px -30px rgba(15, 52, 110, 0.35);
      --glow: rgba(37, 99, 235, 0.12);
      --nav: rgba(245, 248, 255, 0.82);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }
    a { color: inherit; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: var(--nav);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 68px; }
    .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; font-family: var(--display); font-weight: 700; letter-spacing: -0.2px; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand span small { display: block; font-family: var(--body); font-weight: 600; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 999px;
      border: 1px solid var(--border); background: transparent; color: var(--text);
      cursor: pointer; transition: border-color 0.2s ease, transform 0.15s ease;
    }
    .icon-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .icon-btn svg { width: 18px; height: 18px; }
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }
    [data-theme="light"] .icon-moon { display: block; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 999px; text-decoration: none; font-weight: 700;
      padding: 11px 22px; font-size: 0.92rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04101f;
      box-shadow: 0 10px 30px -12px var(--glow);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px -12px var(--glow); }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); box-shadow: none; }
    .btn.ghost:hover { border-color: var(--accent-2); }
    .btn.lg { padding: 15px 32px; font-size: 1rem; }

    .hero { position: relative; padding: 92px 0 60px; text-align: center; overflow: hidden; }
    .aurora { position: absolute; inset: -30% -10% auto; height: 620px; pointer-events: none; filter: blur(2px); }
    .aurora::before, .aurora::after {
      content: ""; position: absolute; width: 46vw; height: 46vw; max-width: 620px; max-height: 620px;
      border-radius: 50%; opacity: 0.55; filter: blur(70px);
    }
    .aurora::before { left: 4%; top: 0; background: radial-gradient(circle at 30% 30%, var(--accent), transparent 65%); animation: drift 16s ease-in-out infinite alternate; }
    .aurora::after { right: 2%; top: 6%; background: radial-gradient(circle at 70% 40%, var(--accent-2), transparent 65%); animation: drift 20s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate3d(-2%, 0, 0) scale(1); } to { transform: translate3d(3%, 4%, 0) scale(1.06); } }
    .hero .wrap { position: relative; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--display); font-weight: 600; font-size: 0.68rem;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-2);
      border: 1px solid var(--border-strong); border-radius: 999px; padding: 7px 14px;
      background: color-mix(in srgb, var(--surface) 60%, transparent);
    }
    h1 { font-family: var(--display); font-size: clamp(2.05rem, 5.2vw, 3.35rem); line-height: 1.12; letter-spacing: -1px; margin-top: 22px; }
    h1 em { font-style: normal; background: linear-gradient(92deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { color: var(--muted); max-width: 640px; margin: 18px auto 0; font-size: 1.06rem; }
    .hero .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin: 58px auto 0; max-width: 900px; text-align: left; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow); }
    .stat b { display: block; font-family: var(--display); font-size: 1.45rem; color: var(--accent-2); }
    .stat span { color: var(--muted); font-size: 0.86rem; }
    [data-theme="light"] .stat b { color: var(--accent); }

    section { padding: 62px 0; }
    .section-head { max-width: 680px; }
    h2 { font-family: var(--display); font-size: clamp(1.55rem, 3.4vw, 2.15rem); letter-spacing: -0.5px; line-height: 1.2; margin: 10px 0 8px; }
    .sub { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 38px; }
    .card {
      position: relative; background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px; padding: 26px; box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
      animation: rise 0.5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card::before {
      content: ""; position: absolute; inset: 0; border-radius: 22px; padding: 1px;
      background: linear-gradient(135deg, var(--accent-2), transparent 40%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--border-strong); }
    .card:hover::before { opacity: 1; }
    .card h3 { font-family: var(--display); font-size: 1.12rem; letter-spacing: -0.2px; margin: 4px 0 6px; word-break: break-word; }
    .card p { color: var(--muted); font-size: 0.94rem; }
    .card .icon { font-size: 1.5rem; display: inline-block; margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .chip { font-size: 0.74rem; font-weight: 600; background: var(--chip); color: var(--chip-text); border: 1px solid var(--border); padding: 5px 11px; border-radius: 999px; }
    .chip.replicas { background: transparent; color: var(--muted); }
    .skeleton { height: 178px; border-radius: 22px; border: 1px dashed var(--border); background: linear-gradient(100deg, var(--surface) 40%, var(--surface-2) 50%, var(--surface) 60%); background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    .notice { margin-top: 26px; color: var(--muted); font-size: 0.9rem; text-align: center; }

    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 38px; }
    .feat { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 18px; padding: 22px; }
    .feat b { font-family: var(--display); font-size: 0.98rem; }
    .feat p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    .band {
      position: relative; overflow: hidden; margin-top: 38px;
      background: linear-gradient(135deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border-strong); border-radius: 26px;
      padding: 48px 34px; text-align: center; box-shadow: var(--shadow);
    }
    .band::after { content: ""; position: absolute; width: 340px; height: 340px; right: -120px; top: -140px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 70%); }
    .band .btn { margin-top: 24px; }
    footer { border-top: 1px solid var(--border); padding: 34px 0; color: var(--muted); font-size: 0.85rem; }
    .frow { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
    .fbrand { display: flex; align-items: center; gap: 10px; }
    .fbrand img { width: 26px; height: 26px; border-radius: 7px; opacity: 0.9; }
    footer a { color: var(--accent-2); text-decoration: none; }
    [data-theme="light"] footer a { color: var(--accent); }
    @media (max-width: 640px) {
      .brand span small { display: none; }
      .nav .btn { padding: 9px 16px; font-size: 0.84rem; }
      section { padding: 46px 0; }
    }
    </style>
    </head>
    <body>
    <header>
      <div class="wrap nav">
        <a class="brand" href="/aimodels/info">
          <img src="/aimodels/info/logo.png" alt="Big Data Club logo" width="34" height="34">
          <span>AI Models<small>Big Data Club</small></span>
        </a>
        <div class="nav-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <a class="btn" href="https://bdc.hpcc.vn/login">Request access</a>
        </div>
      </div>
    </header>

    <div class="hero">
      <div class="aurora" aria-hidden="true"></div>
      <div class="wrap">
        <span class="kicker">Big Data Club &middot; Campus AI</span>
        <h1>Every AI capability,<br><em>on our own GPUs</em>.</h1>
        <p class="lead">A curated family of AI models runs on high performance GPUs we operate ourselves. Chat, vision, semantic search and speech, all behind one OpenAI compatible experience and built into the platform you already use.</p>
        <div class="cta">
          <a class="btn lg" href="https://bdc.hpcc.vn/login">Request access</a>
          <a class="btn ghost lg" href="#models">Explore the models</a>
        </div>
        <div class="stats">
          <div class="stat"><b id="stat-models">...</b><span>Models available today</span></div>
          <div class="stat"><b id="stat-capabilities">...</b><span>Capability families</span></div>
          <div class="stat"><b>OpenAI</b><span>Compatible API experience</span></div>
          <div class="stat"><b>On campus</b><span>Your data stays on our cluster</span></div>
        </div>
      </div>
    </div>

    <section id="models">
      <div class="wrap">
        <div class="section-head">
          <span class="kicker">Live catalog</span>
          <h2>What you can build with today</h2>
          <p class="sub">Served straight from our cluster, so this list is always current. Every model is monitored and served with redundancy.</p>
        </div>
        <div class="grid" id="model-grid" aria-live="polite">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
        <p class="notice" id="model-notice"></p>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head">
          <span class="kicker">Why BDC Hub</span>
          <h2>Built for the campus,<br>not the cloud</h2>
        </div>
        <div class="features">
          <div class="feat"><b>Your data stays home</b><p>Models run on our own cluster, so coursework and files never leave campus infrastructure.</p></div>
          <div class="feat"><b>OpenAI compatible</b><p>One familiar API shape. Drop the hub into any tool that speaks OpenAI and it just works.</p></div>
          <div class="feat"><b>Built into learning</b><p>Chat, quizzes, flashcards, document Q&amp;A and recommendations are woven into the BDC Hub platform.</p></div>
          <div class="feat"><b>Redundant by design</b><p>Multiple serving replicas per capability keep the hub responsive when it matters most.</p></div>
        </div>
        <div class="band">
          <h2>Try it with your coursework</h2>
          <p class="sub">AI access is granted by our admins. Log in to BDC Hub with your account and request an API key. Onboarding takes a few minutes.</p>
          <a class="btn lg" href="https://bdc.hpcc.vn/login">Request access</a>
        </div>
      </div>
    </section>

    <footer>
      <div class="wrap frow">
        <span class="fbrand"><img src="/aimodels/info/logo.png" alt="" width="26" height="26" loading="lazy">Big Data Club &middot; AI on our own GPU cluster</span>
        <span><a href="https://bdc.hpcc.vn/login">BDC Hub</a> &middot; <a href="/aimodels/info">AI Models</a></span>
      </div>
    </footer>

    <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById('theme-toggle');
      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem('bdc-aimodels-theme', theme); } catch (e) {}
      }
      toggle.addEventListener('click', function () {
        setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });

      var CAPS = {
        chat:        { label: 'Chat',            icon: '\uD83D\uDCAC', note: 'Conversational answers with streamed responses.' },
        completions: { label: 'Text completion', icon: '\u270D\uFE0F', note: 'Prompt in, continuation out.' },
        embeddings:  { label: 'Embeddings',      icon: '\uD83D\uDD0E', note: 'Semantic vectors for search and recommendations.' },
        transcriptions: { label: 'Speech to text', icon: '\uD83C\uDF99\uFE0F', note: 'Turn recordings into clean, searchable text.' },
        translations:   { label: 'Translation',     icon: '\uD83C\uDF10', note: 'Translate audio content across languages.' },
        speech:         { label: 'Text to speech',  icon: '\uD83D\uDD0A', note: 'Natural voices for narration and accessibility.' },
        responses:      { label: 'Responses',       icon: '\uD83E\uDDE9', note: 'Flexible structured responses.' }
      };
      var FALLBACK = [
        { id: 'Conversational Chat', capabilities: ['chat'] },
        { id: 'Vision Understanding', capabilities: ['chat'] },
        { id: 'Semantic Search', capabilities: ['embeddings'] },
        { id: 'Speech to Text', capabilities: ['transcriptions'] },
        { id: 'Text to Speech', capabilities: ['speech'] }
      ];

      function pretty(id) {
        return id
          .replace(/[-_.]+/g, ' ')
          .split(' ')
          .filter(Boolean)
          .map(function (word) {
            if (/^\d/.test(word)) return word.toUpperCase();
            if (word.length <= 2) return word.toUpperCase();
            return word.charAt(0).toUpperCase() + word.slice(1);
          })
          .join(' ');
      }

      function cardFor(model) {
        var el = document.createElement('article');
        el.className = 'card';

        var caps = (model.capabilities && model.capabilities.length) ? model.capabilities : [];
        var primary = CAPS[caps[0]] || { label: 'AI model', icon: '\u2728', note: 'Ready for your next project.' };

        var icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = primary.icon;

        var title = document.createElement('h3');
        title.textContent = pretty(model.id);

        var desc = document.createElement('p');
        desc.textContent = primary.note;

        var chips = document.createElement('div');
        chips.className = 'chips';
        caps.forEach(function (cap) {
          var meta = CAPS[cap];
          if (!meta) return;
          var chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = meta.label;
          chips.appendChild(chip);
        });
        if (model.instances && model.instances > 1) {
          var rep = document.createElement('span');
          rep.className = 'chip replicas';
          rep.textContent = model.instances + ' replicas';
          chips.appendChild(rep);
        }

        el.appendChild(icon);
        el.appendChild(title);
        el.appendChild(desc);
        el.appendChild(chips);
        return el;
      }

      function render(models, fallback) {
        var grid = document.getElementById('model-grid');
        var notice = document.getElementById('model-notice');
        grid.innerHTML = '';
        models.forEach(function (model, index) {
          var node = cardFor(model);
          node.style.animationDelay = Math.min(index * 45, 360) + 'ms';
          grid.appendChild(node);
        });
        notice.textContent = fallback
          ? 'Showing an overview while the live catalog is unavailable. Sign in to see current availability.'
          : '';

        var families = {};
        models.forEach(function (model) {
          (model.capabilities || []).forEach(function (cap) { families[cap] = true; });
        });
        document.getElementById('stat-models').textContent = models.length;
        document.getElementById('stat-capabilities').textContent = Object.keys(families).length || models.length;
      }

      fetch('/aimodels/public/models', { headers: { accept: 'application/json' } })
        .then(function (res) {
          if (!res.ok) throw new Error('catalog unavailable');
          return res.json();
        })
        .then(function (data) {
          var models = (data && data.models) || [];
          if (!models.length) throw new Error('empty catalog');
          render(models, false);
        })
        .catch(function () {
          render(FALLBACK, true);
        });
    })();
    </script>
    </body>
    </html>
