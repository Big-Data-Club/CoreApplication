---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-info
  labels:
    app: ai-gateway-info
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway-info
  template:
    metadata:
      labels:
        app: ai-gateway-info
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        - name: logs
          mountPath: /var/log/nginx
      volumes:
      - name: content
        configMap:
          name: ai-gateway-info-content
      - name: nginx-conf
        configMap:
          name: ai-gateway-info-nginx
      - name: cache
        emptyDir:
          sizeLimit: 8Mi
      - name: run
        emptyDir:
          sizeLimit: 2Mi
      - name: logs
        emptyDir:
          sizeLimit: 8Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-info
  labels:
    app: ai-gateway-info
spec:
  selector:
    app: ai-gateway-info
  ports:
  - name: http
    port: 8091
    targetPort: http
