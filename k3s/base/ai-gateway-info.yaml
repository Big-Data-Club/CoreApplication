# ── AI Gateway marketing site (bdc.hpcc.vn/aimodels/info) ────────────────────
# Fully static, zero-JS, single-file HTML served by a minimal nginx pod.
# Separate from the ai-gateway Deployment so public traffic for the marketing
# page never touches the tunnel/gateway services. Content is Marketing-safe:
# model families and capabilities only — NO hosts, ports, model IDs, keys or
# cluster topology. Automounted API token disabled (no K8s API usage).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-info-nginx
  labels:
    app: ai-gateway-info
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      server_tokens off;
      root /usr/share/nginx/html;
      index index.html;
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
    }

