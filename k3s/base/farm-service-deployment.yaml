apiVersion: apps/v1
kind: Deployment
metadata:
  name: farm-service
  labels:
    app: farm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farm-service
  template:
    metadata:
      labels:
        app: farm-service
    spec:
      containers:
      - name: farm-service
        image: phucnhan2809/bdc-farm:latest
        ports:
        - containerPort: 8087
        env:
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: bdc-config
              key: KAFKA_BROKERS
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: JWT_SECRET
        - name: FARM_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bdc-farm-secrets
              key: FARM_DATABASE_URL
        - name: FARM_EVENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bdc-farm-secrets
              key: FARM_EVENT_SECRET
        - name: AI_SERVICE_SECRET
          valueFrom:
            secretKeyRef:
              name: bdc-secrets
              key: AI_SERVICE_SECRET
        - name: LMS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: bdc-config
              key: LMS_SERVICE_URL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8087
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: farm-service
spec:
  selector:
    app: farm-service
  ports:
  - name: http
    port: 8087
    targetPort: 8087
