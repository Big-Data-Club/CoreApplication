auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem
limits_config:
  retention_period: 72h
  max_query_lookback: 72h
  reject_old_samples: true
  reject_old_samples_max_age: 72h
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_line_size: 256KB
  max_line_size_truncate: true
  max_query_parallelism: 2
  split_queries_by_interval: 1h
  max_entries_limit_per_query: 5000
  # Keep workload identity from Kubernetes, including ai-worker (whose JSON
  # currently calls itself ai-service). Never infer service_name from log text.
  discover_service_name: []
querier:
  max_concurrent: 2
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32
analytics:
  reporting_enabled: false
