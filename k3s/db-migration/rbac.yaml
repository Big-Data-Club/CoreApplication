apiVersion: v1
kind: ServiceAccount
metadata:
  name: bdc-db-migration-console
  namespace: default
imagePullSecrets:
  - name: dockerhub-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bdc-db-migration-worker
  namespace: default
imagePullSecrets:
  - name: dockerhub-registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bdc-db-migration-console
  namespace: default
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [bdc-db-operation, bdc-db-migration]
    verbs: [get, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bdc-db-migration-console
  namespace: default
subjects:
  - kind: ServiceAccount
    name: bdc-db-migration-console
roleRef:
  kind: Role
  name: bdc-db-migration-console
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bdc-db-migration-worker
  namespace: default
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [bdc-db-operation, bdc-db-migration, bdc-config]
    verbs: [get, update, patch]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [bdc-db-source, bdc-db-target, bdc-secrets, bdc-db-migration-recovery]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [bdc-secrets, bdc-db-migration-recovery]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [auth-service, lms-service, lab-service, chat-service, ai-service, ai-worker, course-blueprint-worker, ai-lab-authoring-worker, dutylog-service]
    verbs: [patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bdc-db-migration-worker
  namespace: default
subjects:
  - kind: ServiceAccount
    name: bdc-db-migration-worker
roleRef:
  kind: Role
  name: bdc-db-migration-worker
  apiGroup: rbac.authorization.k8s.io
