apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - controller.yaml
  - rbac.yaml
  - dashboard.yaml
configMapGenerator:
  - name: bdc-db-migration-profiles
    namespace: default
    files:
      - profiles.json
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: bdc-db-migration
    newName: bdc-db-migration
    newTag: configure-immutable-tag
replacements:
  - source:
      kind: Deployment
      name: bdc-db-migration-console
      fieldPath: spec.template.spec.containers.0.image
    targets:
      - select:
          kind: Deployment
          name: bdc-db-migration-console
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=MIGRATION_IMAGE].value
