# Disposable verification only. No application credentials or production volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: farm_test
      POSTGRES_PASSWORD: farm_test
      POSTGRES_DB: farm_test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U farm_test -d farm_test']
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  kafka:
    image: bitnamilegacy/kafka:3.7.0
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    healthcheck:
      test: [CMD-SHELL, 'kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 5s
      timeout: 5s
      retries: 30
  farm-tests:
    image: golang:1.25
    working_dir: /work
    volumes:
      - ..:/source:ro
      - go-cache:/go
    environment:
      FARM_TEST_DATABASE_URL: postgres://farm_test:farm_test@postgres:5432/farm_test?sslmode=disable
    command: sh -c 'cp -R /source/. /work/ && go test -race -count=1 -v ./...'
    depends_on:
      postgres:
        condition: service_healthy
  auth-tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /work
    volumes:
      - ../../auth-and-management-service/pom.xml:/source/pom.xml:ro
      - ../../auth-and-management-service/src:/source/src:ro
      - ../../auth-and-management-service/migrations:/source/migrations:ro
      - maven-cache:/root/.m2
    environment:
      FARM_TEST_JDBC_URL: jdbc:postgresql://postgres:5432/farm_test
      FARM_TEST_KAFKA_BROKERS: kafka:9092
    command: sh -c 'cp -R /source/. /work/ && mvn -B -ntp test'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  go-cache:
  maven-cache:
