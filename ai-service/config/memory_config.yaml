# =============================================================================
# Memory Pipeline Configuration
# Externalized memory pipeline settings for the Cognitive Agent.
# Loaded by app.core.config at startup.
# =============================================================================

# ── Token Budgets ────────────────────────────────────────────────────────────
# Maximum context tokens allocated to each memory source when building the
# system prompt. The context_builder respects these limits per-source.
# stm = Short-Term Memory (recent conversation turns); ltm_* = Long-Term
# Memory (episodic summaries from Qdrant / student facts from knowledge_nodes);
# user_profile = concept mastery profile (struggles/strengths).
# NOTE: values must be bare integers - the loader does not strip inline comments.
token_budgets:
  stm: 3000
  ltm_episodic: 800
  ltm_facts: 400
  user_profile: 300
  max_context_tokens: 6000

# ── Decay Rates ──────────────────────────────────────────────────────────────
# Time-based exponential decay (half-life in days) for recency scoring.
decay_rates:
  half_life_days: 10.0

# ── Consolidation Pipeline ───────────────────────────────────────────────────
# turn_interval: run consolidation every N turns
# min_importance_score: heuristic importance threshold for deep extraction
consolidation:
  turn_interval: 5
  min_importance_score: 0.7
