name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag to deploy (defaults to this commit SHA)
        required: false
        type: string
      services:
        description: Comma-separated deployments for a manual rollout (required with image_tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  detect-changes:
    name: Select production workloads
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.select.outputs.should_build }}
      matrix: ${{ steps.select.outputs.matrix }}
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            auth:
              - 'auth-and-management-service/**'
              - 'k3s/base/auth-service-deployment.yaml'
              - 'k3s/base/configmap.yaml'
              - 'scripts/deploy-production.sh'
            ai:
              - 'ai-service/**'
              - 'k3s/base/ai-service-deployment.yaml'
              - 'k3s/base/course-blueprint-worker-deployment.yaml'
              - 'k3s/base/kafka-statefulset.yaml'
              - 'k3s/base/configmap.yaml'
              - 'scripts/deploy-production.sh'
            recommender:
              - 'recommender-service/**'
              - 'k3s/base/recommender-service-deployment.yaml'
              - 'k3s/base/configmap.yaml'
              - 'scripts/deploy-production.sh'
            personalize:
              - 'personalize-service/**'
              - 'k3s/base/personalize-service-deployment.yaml'
              - 'k3s/base/configmap.yaml'
              - 'scripts/deploy-production.sh'
            lms:
              - 'lms-service/**'
              - 'k3s/base/lms-service-deployment.yaml'
              - 'k3s/base/configmap.yaml'
              - 'scripts/deploy-production.sh'
            lab:
              - 'lab-service/**'
              - 'k3s/base/lab-service-deployment.yaml'
              - 'k3s/base/lab-sandbox-policy.yaml'
              - 'scripts/deploy-production.sh'
              # Keep the lab production selector itself deployable.
              - '.github/workflows/production.yml'
            chat:
              - 'chat-service/**'
              - 'k3s/base/chat-service-deployment.yaml'
              - 'scripts/deploy-production.sh'
              # Keep a workflow fix deployable: this file controls the chat
              # production selection itself.
              - '.github/workflows/production.yml'

      - id: select
        env:
          AI_CHANGED: ${{ steps.changes.outputs.ai }}
          AUTH_CHANGED: ${{ steps.changes.outputs.auth }}
          RECOMMENDER_CHANGED: ${{ steps.changes.outputs.recommender }}
          PERSONALIZE_CHANGED: ${{ steps.changes.outputs.personalize }}
          LMS_CHANGED: ${{ steps.changes.outputs.lms }}
          LAB_CHANGED: ${{ steps.changes.outputs.lab }}
          CHAT_CHANGED: ${{ steps.changes.outputs.chat }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          MANUAL_SERVICES: ${{ inputs.services }}
        shell: bash
        run: |
          set -euo pipefail
          items=()
          services=()

          if [[ "${AUTH_CHANGED}" == "true" ]]; then
            items+=('{"image":"bdc-backend","context":"auth-and-management-service"}')
            services+=(auth-service)
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_IMAGE_TAG}" ]]; then
            if [[ -z "${MANUAL_SERVICES}" ]]; then
              echo "services is required when deploying an existing image tag" >&2
              exit 1
            fi
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "services=${MANUAL_SERVICES}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${AI_CHANGED}" == "true" ]]; then
            items+=('{"image":"bdc-ai","context":"ai-service"}')
            services+=(ai-service ai-worker course-blueprint-worker)
          fi
          if [[ "${RECOMMENDER_CHANGED}" == "true" ]]; then
            items+=('{"image":"bdc-recommender","context":"recommender-service"}')
            services+=(recommender-service)
          fi
          if [[ "${PERSONALIZE_CHANGED}" == "true" ]]; then
            items+=('{"image":"bdc-personalize","context":"personalize-service"}')
            services+=(personalize-service)
          fi
          if [[ "${LMS_CHANGED}" == "true" ]]; then
            items+=('{"image":"bdc-lms","context":"lms-service"}')
            services+=(lms-service)
          fi
          if [[ "${LAB_CHANGED}" == "true" ]]; then
            items+=('{"image":"bdc-lab","context":"lab-service"}')
            items+=('{"image":"bdc-lab-scala-sandbox","context":"lab-service/sandbox/scala"}')
            services+=(lab-service)
          fi
          if [[ "${CHAT_CHANGED}" == "true" ]]; then
            items+=('{"image":"bdc-chat","context":"chat-service"}')
            services+=(chat-service)
          fi

          if [[ ${#items[@]} -eq 0 ]]; then
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'services=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=,
          echo "matrix={\"include\":[${items[*]}]}" >> "$GITHUB_OUTPUT"
          echo "services=${services[*]}" >> "$GITHUB_OUTPUT"
          echo 'should_build=true' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Check out CoreApplication
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ github.sha }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_CHAT_WS_URL=${{ vars.NEXT_PUBLIC_CHAT_WS_URL }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  deploy:
    name: Roll out production
    needs: [detect-changes, build]
    if: >-
      always() && needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.services != '' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    env:
      KUBECONFIG: ${{ vars.PRODUCTION_KUBECONFIG || '/home/bdc_web/.kube/config' }}
    permissions:
      contents: read

    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Verify production kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          test -r "$KUBECONFIG" || {
            echo "Runner kubeconfig is not readable: $KUBECONFIG" >&2
            exit 1
          }
          kubectl get nodes

      - name: Log in to Docker Hub for K3s pulls
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
          DEPLOY_NAMESPACE: default
        shell: bash
        run: |
          set -euo pipefail
          kubectl create secret docker-registry dockerhub-registry \
            --namespace "$DEPLOY_NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default --namespace "$DEPLOY_NAMESPACE" \
            --type merge -p '{"imagePullSecrets":[{"name":"dockerhub-registry"}]}'

      - name: Apply AI schema migrations before rollout
        # The current ai-service pod already has the DB credentials and
        # asyncpg installed.  Applying additive migrations before replacing
        # it prevents a new API/worker from ever observing a half-upgraded
        # course_blueprints table.  V010 is idempotent by design.
        if: contains(needs.detect-changes.outputs.services, 'ai-service')
        env:
          DEPLOY_NAMESPACE: default
        shell: bash
        run: |
          set -euo pipefail
          # Pick a Running AND Ready pod: terminated/Failed pods from earlier
          # crashes linger in the namespace and .items[0] order is arbitrary.
          POD="$(kubectl get pod -n "$DEPLOY_NAMESPACE" -l app=ai-service \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[?(@.status.containerStatuses[0].ready==true)].metadata.name}' \
            | awk '{print $1}')"
          if [[ -z "${POD}" ]]; then
            echo "No Running/Ready ai-service pod found for migration." >&2
            kubectl get pod -n "$DEPLOY_NAMESPACE" -l app=ai-service -o wide >&2 || true
            exit 1
          fi
          echo "Running AI schema migration in pod ${POD}"
          kubectl exec -n "$DEPLOY_NAMESPACE" "$POD" -- python -c '
          import asyncio, os, asyncpg
          SQL = """
          ALTER TABLE course_blueprints
              ADD COLUMN IF NOT EXISTS processing_stage VARCHAR(32) NOT NULL DEFAULT '\''QUEUED'\'',
              ADD COLUMN IF NOT EXISTS progress_pct SMALLINT NOT NULL DEFAULT 0
                  CHECK (progress_pct >= 0 AND progress_pct <= 100),
              ADD COLUMN IF NOT EXISTS lease_owner VARCHAR(255),
              ADD COLUMN IF NOT EXISTS lease_until TIMESTAMPTZ,
              ADD COLUMN IF NOT EXISTS attempts INTEGER NOT NULL DEFAULT 0;
          CREATE INDEX IF NOT EXISTS idx_course_blueprints_recovery
              ON course_blueprints (status, lease_until, updated_at)
              WHERE status = '\''PROCESSING'\'';
          CREATE TABLE IF NOT EXISTS course_material_routing_jobs (
              id UUID PRIMARY KEY, owner_id BIGINT NOT NULL, course_id BIGINT NOT NULL,
              status VARCHAR(20) NOT NULL DEFAULT '\''PROCESSING'\''
                  CHECK (status IN ('\''PROCESSING'\'','\''READY'\'','\''FAILED'\'','\''CANCELLED'\'')),
              documents JSONB NOT NULL, sections JSONB NOT NULL,
              suggestions JSONB NOT NULL DEFAULT '\''[]'\''::jsonb, error_message TEXT,
              lease_owner VARCHAR(255), lease_until TIMESTAMPTZ,
              attempts INTEGER NOT NULL DEFAULT 0,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE INDEX IF NOT EXISTS idx_material_routing_recovery
              ON course_material_routing_jobs(status, lease_until, updated_at)
              WHERE status='\''PROCESSING'\'';
          """
          async def main():
              conn = await asyncpg.connect(host=os.environ["AI_DB_HOST"], port=int(os.environ["AI_DB_PORT"]), user=os.environ["AI_DB_USER"], password=os.environ["AI_DB_PASSWORD"], database=os.environ["AI_DB_NAME"])
              try:
                  await conn.execute(SQL)
              finally:
                  await conn.close()
          asyncio.run(main())
          '

      - name: Deploy immutable images and verify rollouts
        env:
          REGISTRY_NAMESPACE: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          SERVICES: ${{ needs.detect-changes.outputs.services }}
          DEPLOY_NAMESPACE: default
          ROLLOUT_TIMEOUT: 12m
        run: ./scripts/deploy-production.sh
