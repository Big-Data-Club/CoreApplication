name: Data warehouse - verify, build and deploy

on:
  push:
    branches: [main]
    paths:
      - data-warehouse
      - 'data-warehouse/**'
      - 'k3s/data-warehouse/**'
      - scripts/deploy-data-warehouse.py
      - .github/workflows/data-warehouse-production.yml
  pull_request:
    branches: [main]
    paths:
      - data-warehouse
      - 'data-warehouse/**'
      - 'k3s/data-warehouse/**'
      - scripts/deploy-data-warehouse.py
      - .github/workflows/data-warehouse-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned warehouse source
        run: git submodule update --init -- data-warehouse
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tooling and dependencies
        run: |
          python -m pip install uv==0.11.29
          uv sync --directory data-warehouse --frozen
      - name: Verify locked runtime requirements
        run: |
          uv export --directory data-warehouse --frozen --no-dev --no-header --no-annotate --format requirements-txt --output-file /tmp/runtime-requirements.txt > /dev/null
          diff -u data-warehouse/requirements.txt /tmp/runtime-requirements.txt
      - name: Test crash recovery and load acknowledgements
        run: data-warehouse/.venv/bin/python -m pytest data-warehouse/tests -q
      - name: Validate deployment code and source contract
        run: |
          python -m py_compile scripts/deploy-data-warehouse.py
          python -m unittest discover -s scripts/tests -p test_select_legacy_workloads.py
          python -m unittest discover -s scripts/tests -p test_warehouse_rollout.py
          python -m json.tool k3s/data-warehouse/resources.json > /dev/null
          python data-warehouse/scripts/warehouse.py render > /dev/null
          git diff --check

  build:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      REGISTRY_NAMESPACE: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init -- data-warehouse
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_NAMESPACE }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - name: Build and push pinned warehouse image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./data-warehouse
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY_NAMESPACE }}/bdc-data-warehouse:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=data-warehouse
          cache-to: type=gha,mode=max,scope=data-warehouse
          provenance: mode=max
          sbom: true

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 25
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      KUBECONFIG: ${{ vars.PRODUCTION_KUBECONFIG || '/home/bdc_web/.kube/config' }}
      RELEASE_IMAGE: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/bdc-data-warehouse@${{ needs.build.outputs.digest }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init -- data-warehouse
      - name: Verify runner access
        run: |
          test -r "$KUBECONFIG"
          kubectl -n default get service kafka-service > /dev/null
      - name: Migrate schema, roll out and verify the worker
        run: python3 scripts/deploy-data-warehouse.py --image "$RELEASE_IMAGE" --revision "$RELEASE_REVISION"
