name: CD - Deploy Production (Self-Hosted K8s Rollout)

on:
  workflow_run:
    workflows: ["CI - Build, Test & Push"]
    types: [completed]
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      target_service:
        description: 'Target service deployment to restart (e.g. auth-service, lms-service, frontend, ai-service, recommender-service, chat-service, lab-service, personalize-service, dutylog-service, or "all")'
        required: false
        default: 'all'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  select-workloads:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target_service || 'all' }}
        run: python3 scripts/select-legacy-workloads.py

  deploy:
    name: 🚀 Rollout Kubernetes Deployments
    runs-on: [self-hosted, linux]
    needs: select-workloads
    if: needs.select-workloads.outputs.services != ''
    env:
      KUBECONFIG: ${{ vars.PRODUCTION_KUBECONFIG || '/home/bdc_web/.kube/config' }}
      SELECTED_SERVICES: ${{ needs.select-workloads.outputs.services }}

    steps:
      - name: Check out operations scripts
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Verify production kubeconfig
        run: |
          set -euo pipefail
          test -r "$KUBECONFIG"
          kubectl get nodes

      - name: Acquire database operation lock
        id: db_lock
        run: |
          set -euo pipefail
          owner="legacy-deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          python3 scripts/db-operation-lock.py claim "$owner"
          echo "BDC_OPERATION_OWNER=$owner" >> "$GITHUB_ENV"

      - name: Selective Kubernetes Rollout
        run: |
          echo "🚀 Executing Kubernetes Rollout Restart on Self-Hosted Runner..."
          
          # Detect kubectl / k3s command wrapper
          if command -v kubectl &> /dev/null; then
            KUBECTL="kubectl"
          elif command -v k3s &> /dev/null; then
            KUBECTL="sudo k3s kubectl"
          else
            KUBECTL="sudo kubectl"
          fi
          
          IFS=',' read -r -a selected_deployments <<< "$SELECTED_SERVICES"
          
          restart_deployment() {
            local DEP=$1
            echo "🔄 Triggering rollout restart for deployment/${DEP}..."
            ${KUBECTL} rollout restart deployment/${DEP} || echo "⚠️ Warning: Failed to restart ${DEP}"
            echo "⏳ Waiting for deployment/${DEP} status..."
            ${KUBECTL} rollout status deployment/${DEP} --timeout=180s || echo "⚠️ Timeout waiting for ${DEP}"
          }

          for dep in "${selected_deployments[@]}"; do
            restart_deployment "$dep"
          done

      - name: Health Check & Pod Status
        run: |
          echo "⏳ Checking Pod status post-rollout..."
          if command -v kubectl &> /dev/null; then
            KUBECTL="kubectl"
          elif command -v k3s &> /dev/null; then
            KUBECTL="sudo k3s kubectl"
          else
            KUBECTL="sudo kubectl"
          fi
          ${KUBECTL} get pods -o wide || true

      - name: Cleanup Old Docker Images & K8s Revisions
        if: always()
        run: |
          set -euo pipefail
          ./scripts/k3s-maintenance.sh \
            --namespace default \
            --phase post

      - name: Release database operation lock
        if: always() && steps.db_lock.outcome == 'success'
        run: python3 scripts/db-operation-lock.py release "$BDC_OPERATION_OWNER"

      - name: Deployment Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          [[ "$STATUS" == "success" ]] && ICON="✅" || ICON="❌"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ${ICON} Self-Hosted Kubernetes Deployment ${STATUS}
          | | |
          |---|---|
          | **Runner** | Self-Hosted Linux Runner |
          | **Target** | \`${{ github.event.inputs.target_service || 'all' }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Time** | $(date '+%Y-%m-%d %H:%M:%S %Z') |
          EOF
