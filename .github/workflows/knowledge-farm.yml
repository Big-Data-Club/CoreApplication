name: Knowledge farm contracts and persistence
on:
  pull_request:
    paths:
      - 'farm-service/**'
      - 'auth-and-management-service/**'
      - 'scripts/test-knowledge-farm.sh'
      - 'scripts/sync-farm-config.py'
      - 'scripts/tests/test_sync_farm_config.py'
      - '.github/workflows/knowledge-farm.yml'
  push:
    branches: [main]
    paths:
      - 'farm-service/**'
      - 'auth-and-management-service/**'
      - 'scripts/test-knowledge-farm.sh'
      - 'scripts/sync-farm-config.py'
      - 'scripts/tests/test_sync_farm_config.py'
      - '.github/workflows/knowledge-farm.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p 'test_sync_farm_config.py'
      - run: bash scripts/test-knowledge-farm.sh
